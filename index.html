<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Задачі</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>

:root { --bg: #F4F4F1; --card: #FFFFFF; --ink: #0F0F10; --muted: #6B6B70; --soft: #8C8C91; --line: #E6E5E0; --chip: #E9E8E3; --ring: #C9C8C2;
  --acc: #2D5BFF; --acc-soft: #E8EEFF; --red: #C62828; --red-soft: #FDECEC; --amb: #9A6A00; --amb-soft: #FFF4D6; --grn: #1F9D55; --grn-soft: #E6F5EC;
  --on-red: #FFFFFF; --now-btn: rgba(255,255,255,.14); --sh: 0 1px 2px rgba(15,15,16,.05), 0 10px 28px rgba(15,15,16,.07);
  --f: "Inter Tight", "Helvetica Neue", Arial, system-ui, sans-serif; }
:root.dark { --bg: #0C0C0E; --card: #18181B; --ink: #F2F1EE; --muted: #A1A1A8; --soft: #7C7C83; --line: #2A2A2F; --chip: #26262B; --ring: #4A4A50;
  --acc: #5B7FFF; --acc-soft: #1C2340; --red: #FF6B6B; --red-soft: #3A1A1A; --amb: #F2C14E; --amb-soft: #2B2416; --grn: #4CC47E; --grn-soft: #15291D;
  --on-red: #0C0C0E; --now-btn: rgba(0,0,0,.09); --sh: 0 10px 30px rgba(0,0,0,.35); color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--f); }
body { min-height: 100vh; }
button, input { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, input:focus-visible, a:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
a { color: var(--acc); }
[hidden] { display: none !important; }
.red { color: var(--red); } .amb { color: var(--amb); } .grn { color: var(--grn); }
main { max-width: 560px; margin: 0 auto; padding: 18px 16px 108px; }
.load { color: var(--muted); padding: 80px 0; text-align: center; }
.noacc { padding: 96px 8px 0; text-align: center; display: grid; gap: 12px; justify-items: center; }
.noacc .ic { font-size: 40px; }
.noacc h2 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
.noacc p { margin: 0 0 12px; color: var(--muted); max-width: 300px; line-height: 1.45; }
.noacc .b { width: 100%; max-width: 320px; }


nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--card); border-top: 1px solid var(--line); padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; color: var(--soft); font-size: 11.5px; font-weight: 600; position: relative; text-align: center; }
nav button.on { color: var(--ink); }
.badge { position: absolute; top: 1px; left: 54%; min-width: 18px; height: 18px; border-radius: 9px; background: var(--acc); color: #fff; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.badge.r { background: var(--red); color: var(--on-red); }
.toast { position: fixed; left: 50%; top: 12px; transform: translate(-50%, -160px); background: var(--ink); color: var(--bg); padding: 0 6px 0 16px; min-height: 44px; display: flex; align-items: center; gap: 4px;
  border-radius: 14px; font-size: 15px; font-weight: 500; visibility: hidden; transition: transform .25s, visibility 0s .25s; z-index: 25; white-space: nowrap; max-width: calc(100% - 32px); }
.toast.on { transform: translate(-50%, 0); visibility: visible; transition: transform .25s; }
.toast span { padding-right: 10px; overflow: hidden; text-overflow: ellipsis; }
.toast button { min-height: 44px; padding: 0 12px; font-weight: 700; color: #8FA8FF; }
:root.dark .toast button { color: var(--acc); }
.pv { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; background: var(--amb-soft); color: var(--amb); border-radius: 16px; padding: 8px 8px 8px 14px; margin-bottom: 14px; font-size: 13px; font-weight: 500; }
.pv button { min-height: 44px; padding: 0 16px; border-radius: 99px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 600; }


.hd { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
.lbl { font-size: 13px; font-weight: 500; color: var(--muted); }
h1 { margin: 4px 0 0; font-size: 34px; font-weight: 400; letter-spacing: -.035em; line-height: 1; }
.ib { width: 44px; height: 44px; border-radius: 14px; background: var(--card); display: grid; place-items: center; flex: none; }
.st { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.st.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.st button { background: var(--card); border-radius: 16px; min-height: 64px; padding: 10px 12px; display: grid; align-content: center; gap: 2px; min-width: 0; }
.st.c4 button { padding: 10px; }
.st b { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.st span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st button.on { background: var(--ink); color: var(--bg); }
.st button.on b, .st button.on span { color: inherit; } .st button.on span { opacity: .7; }
.sec { display: flex; justify-content: space-between; align-items: center; margin: 20px 2px 8px; min-height: 24px; }
.sec b { font-size: 13px; font-weight: 600; color: var(--muted); }
.list { display: grid; gap: 8px; }
.more { display: grid; place-items: center; width: 100%; min-height: 48px; border-radius: 16px; background: var(--chip); color: var(--ink); font-size: 15px; font-weight: 600; text-align: center; margin-top: 8px; text-decoration: none; }

.mp { width: 100%; background: var(--card); border-radius: 22px; padding: 16px; display: grid; gap: 10px; text-align: left; min-width: 0; }
.mp .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.mp .top b { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.mchip { font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.mchip.red { background: var(--red-soft); color: var(--red); } .mchip.amb { background: var(--amb-soft); color: var(--amb); } .mchip.grn { background: var(--grn-soft); color: var(--grn); }
.mp .kp { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 8px; }
.mp .kp b { font-size: 22px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.mp .kp span { font-size: 13px; color: var(--muted); text-align: right; }
.mbar { position: relative; height: 8px; border-radius: 99px; margin-top: 4px; background: linear-gradient(90deg, var(--red-soft) 0 33.3%, var(--amb-soft) 33.3% 66.7%, var(--grn-soft) 66.7% 100%); }
.mbar i { position: absolute; top: -4px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); border: 3px solid var(--card); transform: translateX(-50%); }
.mbl { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--soft); }
.mp .ft { font-size: 13px; color: var(--muted); }
.wk1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; } .wk1 b { font-size: 34px; font-weight: 600; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; } .wk1 span { font-size: 13px; font-weight: 600; }
.wbars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; align-items: end; }
.wbars div { display: grid; gap: 4px; justify-items: center; align-self: end; min-width: 0; }
.wbars s { display: block; width: 100%; border-radius: 8px; background: var(--chip); text-decoration: none; }
.wbars s.on { background: var(--acc); }
.wbars em { font-style: normal; font-size: 13px; font-weight: 600; } .wbars span { font-size: 11.5px; color: var(--soft); white-space: nowrap; }
.src0 { font-size: 13px; color: var(--soft); text-align: center; margin-top: 18px; }
.s13 { font-size: 13px; color: var(--muted); }
.empty { background: var(--card); border-radius: 24px; padding: 44px 24px; text-align: center; margin-top: 14px; }
.empty b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.02em; } .empty p { margin: 6px 0 0; color: var(--muted); }


.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.b { display: grid; place-items: center; min-height: 52px; border-radius: 16px; font-size: 15px; font-weight: 600; text-align: center; background: var(--card); border: 1px solid var(--line); color: var(--ink); padding: 0 10px; text-decoration: none; }
.b.pri { background: var(--acc); border-color: var(--acc); color: #fff; }
.b.mut { color: var(--muted); }
.b.w2 { grid-column: 1 / -1; }
.g4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }


.row { display: grid; grid-template-columns: 52px minmax(0, 1fr); background: var(--card); border-radius: 18px; min-height: 64px; width: 100%; }
.row.av3 { grid-template-columns: 52px minmax(0, 1fr) 44px; }
.ck { display: grid; place-items: center; min-height: 64px; }
.ck i { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ring); display: grid; place-items: center; }
.ck svg { opacity: 0; }
.ck.ro i { opacity: .4; }
.row.done .ck i { background: var(--acc); border-color: var(--acc); } .row.done .ck svg { opacity: 1; }
.rt { padding: 11px 14px 11px 0; display: grid; align-content: center; gap: 3px; min-width: 0; }
.rt .n { font-size: 15px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.row.big .rt .n { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.rt .m, .rt .d { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt .d { color: var(--amb); }
.rt .m .new { color: var(--acc); font-weight: 600; }
.row.done .n { text-decoration: line-through; color: var(--soft); }
.row .av { align-self: center; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; flex: none; }
.av.lg { width: 40px; height: 40px; font-size: 15px; }
.star { color: var(--acc); }


.now { position: relative; background: var(--ink); color: var(--bg); border-radius: 24px; padding: 18px; display: grid; gap: 16px; margin-top: 14px; touch-action: pan-y; user-select: none; -webkit-user-select: none; will-change: transform; }
.now .nt { display: block; width: 100%; min-height: 44px; }
.cap { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; opacity: .65; }
.now .t { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; margin-top: 6px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.now .m { font-size: 13px; opacity: .72; margin-top: 8px; }
.now .b { background: var(--now-btn); border-color: transparent; color: var(--bg); }
.now .b.pri { background: var(--acc); color: #fff; }
.stamp { position: absolute; top: 16px; right: 16px; font-size: 13px; font-weight: 700; color: #fff; padding: 5px 10px; border-radius: 8px; opacity: 0; transition: opacity .1s; pointer-events: none; }
.stack { position: relative; }
.ghost { position: absolute; left: 12px; right: 12px; top: 14px; bottom: 0; background: var(--card); border-radius: 24px; opacity: .55; }
.sw { position: relative; background: var(--card); border-radius: 24px; padding: 20px; display: grid; gap: 16px; box-shadow: var(--sh); touch-action: pan-y; user-select: none; -webkit-user-select: none; will-change: transform; margin-bottom: 14px; }
.src { display: flex; align-items: center; gap: 12px; min-width: 0; }
.src > div:last-child { min-width: 0; }
.sq { width: 40px; height: 40px; border-radius: 12px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 13px; font-weight: 600; flex: none; }
.src b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quote { background: var(--bg); border-radius: 14px; padding: 12px 14px; font-size: 15px; color: var(--muted); }
.k { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.task { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
.ppl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ppl.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pp { display: flex; align-items: center; gap: 8px; padding: 0 12px 0 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); min-height: 44px; font-size: 15px; font-weight: 500; min-width: 0; }
.pp.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pp span.nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.why { font-size: 13px; color: var(--muted); margin-top: 8px; }
.foot { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.pill { font-size: 13px; font-weight: 600; background: var(--bg); color: var(--ink); padding: 5px 10px; border-radius: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 15px; font-weight: 500; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }


.deck { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 14px -16px 0; padding: 2px 16px 8px; scroll-padding: 0 16px; scrollbar-width: none; }
.deck::-webkit-scrollbar { display: none; }
.pc { flex: 0 0 calc(100% - 30px); scroll-snap-align: start; background: var(--card); border-radius: 24px; padding: 16px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.pc.one { flex-basis: 100%; }
.pc[role="button"] { cursor: pointer; }
.pch { display: flex; align-items: center; gap: 12px; min-width: 0; }
.pn { flex: 1; min-width: 0; }
.pn b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pn span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { width: 32px; height: 32px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; color: var(--muted); flex: none; }
.vd { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; }
.vd .w { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.vd .m { font-size: 13px; color: var(--muted); margin-top: 3px; }
.rg { position: relative; flex: none; } .rg svg { display: block; }
.rg b { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.axr { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; row-gap: 1px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }

.axr .pt { grid-column: 2; grid-row: 1 / span 2; }
.pt { min-width: 42px; height: 28px; padding: 0 8px; border-radius: 9px; display: inline-grid; place-items: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--bg); color: var(--muted); white-space: nowrap; flex: none; }
.pt.red { background: var(--red-soft); color: var(--red); } .pt.amb { background: var(--amb-soft); color: var(--amb); } .pt.grn { background: var(--grn-soft); color: var(--grn); }
.tip { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; font-size: 15px; line-height: 1.35; border-top: 1px solid var(--line); padding-top: 12px; min-height: 53px; }
.tip svg { margin-top: 1px; }
.tip span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 99px; background: var(--chip); transition: width .2s; } .dots i.on { width: 20px; background: var(--ink); }
.pr { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--card); border-radius: 18px; min-height: 64px; padding: 10px 14px 10px 10px; width: 100%; }
.pr .n { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr .m { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr .x { text-align: right; } .pr .x b { display: block; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; } .pr .x span { font-size: 13px; color: var(--muted); white-space: nowrap; }
.e4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.e4 button { display: grid; justify-items: center; gap: 4px; padding: 10px 2px; border-radius: 14px; background: var(--bg); font-size: 13px; font-weight: 600; text-align: center; }


.back { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; background: var(--card); border-radius: 99px; padding: 0 18px 0 14px; min-height: 44px; margin-bottom: 12px; }
.pg { display: grid; gap: 10px; }
.card { background: var(--card); border-radius: 22px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.card h2 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em; overflow-wrap: anywhere; }
.card p { margin: 0; }
.nx { background: var(--acc-soft); border-radius: 22px; padding: 16px; display: grid; gap: 14px; }
.nx .l { font-size: 13px; font-weight: 600; color: var(--acc); }
.nx p { margin: 3px 0 0; font-size: 17px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
.axh { display: flex; justify-content: space-between; align-items: center; gap: 10px; } .axh b { font-size: 17px; font-weight: 600; }
.f3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.f3 div, .f2 div { background: var(--bg); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.f3 span, .f2 span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f3 b { display: block; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.f2 b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scale { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; background: var(--chip); border-radius: 14px; padding: 3px; }
.scale span { min-height: 44px; border-radius: 11px; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--muted); text-align: center; }
.scale span.on { background: var(--card); color: var(--ink); }
.scale span.on.red { color: var(--red); } .scale span.on.grn { color: var(--grn); }
.nl { display: grid; }
.nl div { padding: 10px 0; border-top: 1px solid var(--line); line-height: 1.4; overflow-wrap: anywhere; }
.nl div:first-child { border-top: 0; padding-top: 0; } .nl div:last-child { padding-bottom: 0; }

.msg { background: var(--card); border-radius: 18px; padding: 12px 14px; }

.msg p { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
mark { background: #FFE14A; color: #0F0F10; border-radius: 3px; padding: 0 1px; }


.gh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.gh b { font-size: 34px; font-weight: 400; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.gbar { height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; } .gbar i { display: block; height: 100%; border-radius: 99px; background: var(--ink); }
.bc { background: var(--card); border-radius: 18px; display: grid; }

  var m = isM(), mp = m && S.d.projects && S.d.projects.ok, tabs = m ? ['today'].concat(mp ? ['proj'] : [], ['week']) : ['today', 'inbox', 'proj', 'team', 'brief'];
  $('nav').hidden = false; document.querySelector('nav .in').style.gridTemplateColumns = 'repeat(' + tabs.length + ', minmax(0, 1fr))';
  [].forEach.call(document.querySelectorAll('nav [data-tab]'), function (b) { b.hidden = tabs.indexOf(b.getAttribute('data-tab')) < 0; });
  if (m) { ['bInbox', 'bProj', 'bTeam'].forEach(function (x) { $(x).hidden = true; }); }
  [].forEach.call(document.querySelectorAll('nav [data-tab]'), function (b) { var on = b.getAttribute('data-tab') === S.tab; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (m) return;

function deck(id, key, dotsId, onMove) {
  var box = $(id); if (!box || !box.children.length) return;
  var step = function () { return box.children[0].offsetWidth + 10; };
  box.scrollLeft = S[key] * step();
  box.addEventListener('scroll', function () { var i = Math.round(box.scrollLeft / step()); if (i === S[key]) return; S[key] = i; var d = $(dotsId); if (d) [].forEach.call(d.children, function (x, j) { x.classList.toggle('on', j === i); }); if (onMove) onMove(i); }, { passive: true });
}
function render(keep) {
  if (isM() && ['today', 'proj', 'week'].indexOf(S.tab) < 0) S.tab = 'today';

  var pg = top_(), y = window.scrollY, h;
  if (pg) h = pg.k === 'task' ? vTask(pg.id) : pg.k === 'proj' ? (isM() ? vMProjPage(pg.id) : vProjPage(pg.id)) : pg.k === 'closed' ? vClosed(pg.id) : pg.k === 'old' ? vOld() : vSearch();

    [].forEach.call(document.querySelectorAll('.ppl [data-set]'), function (el) { var on = el.getAttribute('data-set') === 'person:' + k; el.classList.toggle('on', on); el.setAttribute('aria-pressed', on); }); });
  var q = $('q'); if (q) {
    q.value = S.q; q.addEventListener('input', function () { S.q = q.value; paintSearch(); });
    q.addEventListener('keydown', function (e) { if (e.key === 'Enter') { saveQ(); q.blur(); } });
    paintSearch();
  }
}
function saveQ() { var v = S.q.trim(); if (v.length >= 2 && !isM()) remember('ha_rq', v, 6); }

function hideTask(id, kind, why) {
  (kind === 'z' ? S.tom : S.done)[id] = 1; if (S.pend[id]) clearTimeout(S.pend[id].t);
  S.pend[id] = { k: kind, r: why || '', t: setTimeout(function () { delete S.pend[id]; send_(id, kind, why); }, 4000) };
}
function send_(id, kind, why) {
  S.statsAt = 0;
  var back = function () { delete S.done[id]; delete S.tom[id]; toast('Не вийшло, спробуй ще раз'); render(1); };

}
function soon_() { clearTimeout(S.soon); S.soon = setTimeout(function () { S.at = 0; refresh(); }, 700); }
function okOr_(why) { return function (r) { if (!r || r.ok !== true) { toast(why || 'Не вийшло, спробуй ще раз'); } soon_(); }; }
function flushPend(leaving) {
  Object.keys(S.pend).forEach(function (id) {
    var p = S.pend[id]; clearTimeout(p.t); delete S.pend[id];
    var sent = false;
    if (leaving && navigator.sendBeacon) { try { sent = navigator.sendBeacon(API, new Blob([JSON.stringify({ fn: 'kAppAct', args: [S.init, p.k, id, p.r || ''] })], { type: 'text/plain;charset=utf-8' })); } catch (e) { sent = false; } }
    if (!sent) send_(id, p.k, p.r);

}
function popTask(id) { var pg = top_(); if (pg && pg.k === 'task' && pg.id === id) S.stack.pop(); }

function tomorrow(id) { if (/^new-/.test(id) || S.tom[id]) return; hideTask(id, 'z'); popTask(id); toast('Ок, на завтра', id); render(1); }

function sig(d) {
  return [d.mine, d.team, d.inbox, d.wait].map(function (xs) { return (xs || []).map(function (t) { return t.id + ':' + (t.heat || '') + ':' + (t.prio || '') + ':' + (t.owner || t.who || ''); }).join(','); }).join('|') + '|' + (d.brief || []).length + '|' + (d.doneToday || []).map(function (x) { return x.id; }).join(',') + '|' + (d.closed || []).map(function (x) { return x.id; }).join(',') +
    '|' + (d.projects && d.projects.items || []).map(function (p) { return p.key + ':' + (p.s != null ? p.s : p.res) + ':' + (p.r ? p.r[1] : p.f7) + ':' + (p.cs || p.open); }).join(',') + '|' + (d.focus ? d.focus.text : '');
}
function prep(d, people) { d.inbox = d.inbox || []; d.brief = d.brief || []; d.wait = d.wait || []; d.team = d.team || []; d.people = d.people || people || ['Алекс', 'Руслан', 'Юля', 'Віка']; return d; }

function reload() {

  run('kAppData', [S.init, S.as], function (d) {
    if (!d || !d.ok) { if (!S.as) { $('app').innerHTML = '<div class="load">Не завантажилось, закрий і відкрий ще раз</div>'; return; } S.as = ''; toast('Не вийшло'); return reload(); }
    S.d = prep(d); S.at = Date.now(); S.tab = 'today'; S.tf = 'all'; S.stack = []; S.done = {}; S.tom = {}; S.exp = {}; S.stats = null; S.statsAt = 0;
    render();
  }, function () { S.as = ''; $('app').innerHTML = '<div class="load">Не завантажилось, закрий і відкрий ще раз</div>'; });
}
function refresh() {
  if (S.loading || !S.init || !S.d || S.busy) return; S.loading = 1;
  run('kAppData', [S.init, S.as], function (d) {
    S.loading = 0; S.at = Date.now(); if (!d || !d.ok) { if (d && d.why === 'old') toast('Закрий застосунок і відкрий ще раз'); return; }
    prep(d, S.d.people);
    var same = sig(d) === sig(S.d), kd = {}, kt = {}, was = Object.keys(S.done).length + Object.keys(S.tom).length;
    Object.keys(S.done).forEach(function (id) { if (S.pend[id]) kd[id] = 1; }); Object.keys(S.tom).forEach(function (id) { if (S.pend[id]) kt[id] = 1; }); S.done = kd; S.tom = kt;
    var fresh = S.d.mine.concat(S.d.team).filter(function (t) { return /^new-/.test(t.id); });
    fresh.forEach(function (t) { if (!d.mine.concat(d.team).some(function (x) { return x.title === t.title; })) d[t.who === 'Алекс' ? 'mine' : 'team'].unshift(t); });
    S.d = d; var pg = top_(), changed = was !== Object.keys(S.done).length + Object.keys(S.tom).length; if ((same && !changed) || (pg && pg.k === 'search')) return;
    render(1);
  }, function () { S.loading = 0; });
}
document.addEventListener('visibilitychange', function () { if (document.hidden) flushPend(true); else if (Date.now() - S.at > 15000) refresh(); });
window.addEventListener('focus', function () { if (Date.now() - S.at > 15000) refresh(); });
window.addEventListener('pagehide', function () { flushPend(true); });
setInterval(function () { if (!document.hidden && Date.now() - S.at > 30000) refresh(); }, 10000);
document.addEventListener('click', function (e) {
  if (Date.now() - S.dragAt < 400) { e.preventDefault(); return; }
  var g = function (sel) { return e.target.closest(sel); }, b, sw = $('sw'), pg = top_();
  if (!S.d) return;
  if ((b = g('nav [data-tab]'))) { S.tab = b.getAttribute('data-tab'); S.stack = []; S.skip = null; return render(); }
  if ((b = g('[data-undo]'))) { var u = b.getAttribute('data-undo'); if (S.pend[u]) clearTimeout(S.pend[u].t); delete S.pend[u]; delete S.done[u]; delete S.tom[u]; $('toast').classList.remove('on'); return render(1); }
  if ((b = g('[data-search]'))) { S.q = ''; S.stack.push({ k: 'search' }); render(); return; } // пошук з іконки завжди чистий: зверху нещодавні і пропозиції
  if ((b = g('[data-back]'))) { if (pg && pg.k === 'search') saveQ(); S.stack.pop(); S.skip = null; return render(); }
  if ((b = g('[data-q]'))) { S.q = b.getAttribute('data-q'); var qi = $('q'); if (qi) qi.value = S.q; return paintSearch(); }
  if ((b = g('[data-goperson]'))) { S.person = b.getAttribute('data-goperson'); S.tab = 'team'; S.tm = 'tasks'; S.tpf = 'all'; S.stack = []; return render(); }
  if ((b = g('[data-pgo]'))) { S.pf = b.getAttribute('data-pgo'); S.pi = 0; S.tab = 'proj'; S.stack = []; return render(); }

    S[k] = S[k] === v && (k === 'tf' || k === 'tpf' || k === 'pf' || k === 'bf' || k === 'of') ? 'all' : v;
    if (k === 'pf') S.pi = 0; if (k === 'person') S.tpf = 'all';

  if ((b = g('[data-b]'))) { var bi = b.getAttribute('data-b'); S.bo[bi] = !S.bo[bi]; return render(1); }
  if ((b = g('[data-owner]'))) { var c = inbox()[0]; if (c) { S.owners[c.id] = b.getAttribute('data-owner'); render(1); } return; }
  if ((b = g('[data-act]'))) { var yes = b.getAttribute('data-act') === 'take'; if (sw && sw._fly) return sw._fly(yes); return decide(yes); }
  if ((b = g('[data-as]'))) { S.as = b.getAttribute('data-as'); return reload(); }
  if ((b = g('[data-asx]'))) { S.as = ''; return reload(); }
  if ((b = g('[data-old]'))) { S.of = b.getAttribute('data-old'); S.stack.push({ k: 'old' }); return render(); }
  if ((b = g('[data-reopen]'))) return reopen(b.getAttribute('data-reopen'));
  if ((b = g('[data-done]'))) return doneTask(b.getAttribute('data-done'));

  if ((b = g('[data-z]'))) { if (sw && sw._fly && sw.getAttribute('data-sw') === 'now' && sw.contains(b)) return sw._fly(false); return tomorrow(b.getAttribute('data-z')); }
  if ((b = g('[data-skip]'))) { S.skip = b.getAttribute('data-skip') || null; return render(1); }

  if ((b = g('[data-star]'))) {
    var t = find(b.getAttribute('data-star')); if (!t) return; var was = t.prio; t.big = !t.big; t.prio = t.big ? 'Дуже терміновий' : 'Середній'; if (t.big) t.small = false;
    toast(t.big ? '★ Головна' : 'Зняв ★'); render(1); return run('kAppAct', [S.init, 'p', t.id, was === 'Дуже терміновий' ? 'Дуже терміновий' : ''], okOr_());
  }
  if ((b = g('[data-cl]'))) { if (pg && pg.k === 'search') saveQ(); S.stack.push({ k: 'closed', id: b.getAttribute('data-cl') }); return render(); }
  if ((b = g('[data-p]'))) { if (pg && pg.k === 'search') saveQ(); var pk = b.getAttribute('data-p'); seen('p', pk); S.stack.push({ k: 'proj', id: pk }); return render(); }
  if ((b = g('[data-open]'))) { if (pg && pg.k === 'search') saveQ(); var id = b.getAttribute('data-open'); seen('t', id); S.skip = null; S.stack.push({ k: 'task', id: id }); return render(); }
});
document.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"]')) { e.preventDefault(); e.target.click(); } });

function lum(hex) { var h = hex.replace('#', ''); return (0.299 * parseInt(h.substr(0, 2), 16) + 0.587 * parseInt(h.substr(2, 2), 16) + 0.114 * parseInt(h.substr(4, 2), 16)) / 255; }

function noAccess(why, sent) {
  var ask = why === 'nouser';
  $('app').innerHTML = '<div class="noacc"><div class="ic">🔑</div><h2>' + (sent ? 'Запит у Алекса' : 'Доступу поки нема') + '</h2>' +
    '<p>' + (sent ? 'Як тільки він підтвердить, відкрий застосунок ще раз.' : ask ? 'Попроси доступ, і Алекс підтвердить його у себе в Telegram.' : 'Відкрий застосунок з бота в Telegram ще раз.') + '</p>' +
    (ask && !sent ? '<button class="b pri" id="askAcc">Попросити доступ</button>' : '') +
    (sent ? '<button class="b" id="reAcc">Перевірити доступ</button>' : '') + '</div>';
  var a = $('askAcc'); if (a) a.onclick = function () {
    a.disabled = true; a.textContent = 'Надсилаю…';
    run('kAppAsk', [S.init], function (r) {
      if (r && r.has) return reload_(a);
      if (r && r.sent) return noAccess(why, true);
      a.disabled = false; a.textContent = 'Не вийшло, спробуй ще раз';
    }, function () { a.disabled = false; a.textContent = 'Не вийшло, спробуй ще раз'; });
  };

}

  run('kAppData', [S.init, ''], function (d) { if (d && d.ok) { S.d = prep(d); S.at = Date.now(); S.tab = 'today'; render(); } else b.textContent = 'Ще не підтвердив'; }, function () { b.textContent = 'Не вийшло, спробуй ще раз'; });
}
function start(hash) {
  var h = String(hash || '').replace(/^#/, ''), q = new URLSearchParams(h);
  var m = /(?:^|&)tgWebAppData=(.*?)(?=&tgWebApp[A-Za-z]+=|$)/.exec(h), raw = m ? m[1] : '';
  S.init = /%3D|%26/i.test(raw) ? decodeURIComponent(raw) : raw;
  try { var th = JSON.parse(q.get('tgWebAppThemeParams') || '{}'); if (th.bg_color && lum(th.bg_color) < .5) document.documentElement.classList.add('dark'); } catch (e) { }
  if (!S.init) { $('app').innerHTML = '<div class="load">Відкрий це з бота в Telegram)</div>'; return; }
  run('kAppData', [S.init, S.as], function (d) {
